<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Revisión – PRUEBA</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  h1{font-size:18px;margin:0 0 4px;text-align:center} p.meta{margin:0 0 16px;color:#94a3b8;font-size:13px;text-align:center}
  .visor{position:relative;width:min(560px,100%);aspect-ratio:1/1;background:#000;border-radius:12px;overflow:hidden}
  .pista{display:flex;height:100%;transition:transform .35s ease}
  .slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center}
  .slide img{max-width:100%;max-height:100%;object-fit:contain} .slide iframe{width:100%;height:100%;border:0}
  .flecha{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;
  background:rgba(255,255,255,.85);color:#0f172a;font-size:22px;cursor:pointer}
  .izq{left:10px} .der{right:10px} .flecha:disabled{opacity:.25;cursor:default}
  .puntos{display:flex;gap:8px;justify-content:center;margin:14px 0}
  .puntos button{width:9px;height:9px;border-radius:50%;border:0;background:#475569;cursor:pointer;padding:0}
  .puntos button.activo{background:#e2e8f0}
  a.drive{color:#93c5fd;font-size:13px}
</style></head><body>
<h1>PRUEBA</h1>
<p class="meta">Publicación: 02/10/2026 · 4 archivo(s)</p>
<div class="visor"><div class="pista" id="pista">
<div class="slide"><iframe src="https://drive.google.com/file/d/1Rwgb4gNWP2b7uAHZm0d942AhyuFYow6f/preview" allow="autoplay" allowfullscreen></iframe></div>
<div class="slide"><img alt="Slide 2" src="https://drive.google.com/thumbnail?id=1t5fJ143PZAutPVdy0lkJws1T93ysRVBX&sz=w1600"
    onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/1t5fJ143PZAutPVdy0lkJws1T93ysRVBX=w1600'"></div>
<div class="slide"><img alt="Slide 3" src="https://drive.google.com/thumbnail?id=1QgCEa7sFvpzm9EXjNA9KevW25BLvsjUu&sz=w1600"
    onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/1QgCEa7sFvpzm9EXjNA9KevW25BLvsjUu=w1600'"></div>
<div class="slide"><img alt="Slide 4" src="https://drive.google.com/thumbnail?id=1Y7iHOE20-qRKvWy45QCvDLXD5U5BEMSi&sz=w1600"
    onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/1Y7iHOE20-qRKvWy45QCvDLXD5U5BEMSi=w1600'"></div>
</div>
<button class="flecha izq" id="ant" aria-label="Anterior">‹</button>
<button class="flecha der" id="sig" aria-label="Siguiente">›</button></div>
<div class="puntos" id="puntos"></div>
<a class="drive" href="https://drive.google.com/drive/folders/1TOwv1_dBGd_8BllxWAPTTTd5J1HmVTAF" target="_blank">Abrir los archivos originales en Drive</a>
<script>
  const pista=document.getElementById('pista'), total=pista.children.length;
  const ant=document.getElementById('ant'), sig=document.getElementById('sig'), puntos=document.getElementById('puntos');
  let i=0;
  for(let k=0;k<total;k++){const b=document.createElement('button');b.onclick=()=>ir(k);puntos.appendChild(b);}
  function ir(n){i=Math.max(0,Math.min(total-1,n));pista.style.transform='translateX(-'+(i*100)+'%)';
    ant.disabled=i===0;sig.disabled=i===total-1;[...puntos.children].forEach((b,k)=>b.classList.toggle('activo',k===i));}
  ant.onclick=()=>ir(i-1); sig.onclick=()=>ir(i+1);
  document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')ir(i-1);if(e.key==='ArrowRight')ir(i+1);});
  let x0=null; pista.addEventListener('touchstart',e=>x0=e.touches[0].clientX);
  pista.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)ir(i+(d<0?1:-1));x0=null;});
  ir(0);
</script></body></html>
